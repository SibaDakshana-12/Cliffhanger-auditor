# Cliffhanger Auditor settings. Change behaviour here, not in code.

windows:
  ending_seconds: 25     # ending window = lines that overlap the last 25s of script time
  opening_seconds: 10    # opening window = lines that start in the first 10s of the next episode
  fallback_lines: 12     # if an episode is too short for a window, use this many lines instead

llm:
  provider: gemini              # which branch of src/llm.py to use
  model: gemini-3.5-flash-lite # main model (see notes/decisions.md D10-D12)
  api_key_env: GEMINI_API_KEY   # name of the variable in .env (the key itself never goes in config)
  temperature: 0                # as repeatable as the API allows
  max_retries: 3                # extra attempts after a failed call or an invalid output
  retry_wait_seconds: 10

model_input:
  # Writer labels hidden from the model (stage directions only, never dialogue).
  mask_words: [cliffhanger, cliffhangers, resolving, resolution]
  mask_with: "[cue]"

save_text: false                # false = outputs keep line IDs, timestamps and scores, not screenplay text

aggregate:
  # Weighted final score (1-5). Weights are re-normalised when a score is missing
  # (the last episode has no next opening). Chosen by judgment, not fitted:
  # pull_to_next is the outcome we care about most; emotional_spike is lowest
  # because in the 10 manual scores it barely separated strong from weak endings.
  weights:
    unresolved_question: 0.25
    emotional_spike: 0.10
    stakes: 0.20
    pull_to_next: 0.30
    next_opening_strength: 0.15
  flag_final_at_or_below: 3.0   # flag if the final score is this or lower...
  flag_pull_at_or_below: 2      # ...or if pull_to_next is this or lower
  low_confidence_below: 0.6     # model-reported confidence under this is shown as "low, check by hand"

cost:
  # USD per 1 million tokens on the PAID tier of the model above. These are the
  # build AI's remembered list prices for gemini-2.5-flash: VERIFY on
  # https://ai.google.dev/gemini-api/docs/pricing before quoting them.
  input_per_million: 0.30
  output_per_million: 2.50      # thinking tokens are billed as output
  episodes_per_show: 50         # used for the "per 100 shows" estimate
